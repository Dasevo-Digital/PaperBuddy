# paperbuddy mit SMB-Freigabe für Netzwerkscanner.
#
#   cp .env.example .env   # Passwörter anpassen
#   docker compose up -d
#
# Danach im Scanner als Ziel einrichten: \\<host>\scans (SMB) oder
# ftp://<host> (FTP), jeweils Benutzer „scanner“.
services:
  paperbuddy:
    build:
      context: ./server
      args:
        OFFICE: ${PAPERBUDDY_OFFICE:-0}   # 1 = LibreOffice für Office-Vorschau
    # Für die Scanner-Suche per mDNS im Heimnetz: network_mode: host
    image: paperbuddy:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PAPERBUDDY_ADMIN_USER: ${PAPERBUDDY_ADMIN_USER:-admin}
      PAPERBUDDY_ADMIN_PASSWORD: ${PAPERBUDDY_ADMIN_PASSWORD:?PAPERBUDDY_ADMIN_PASSWORD in .env setzen}
      PAPERBUDDY_OCR_LANGUAGE: ${PAPERBUDDY_OCR_LANGUAGE:-deu+eng}
      PAPERBUDDY_SCANNERS: ${PAPERBUDDY_SCANNERS:-}
      PAPERBUDDY_URL: ${PAPERBUDDY_URL:-}
      PAPERBUDDY_TRUSTED_PROXIES: ${PAPERBUDDY_TRUSTED_PROXIES:-}
    volumes:
      - ./data:/data
      - ./consume:/consume

  # Optional: Freigabe des Eingangsordners für Scanner (SMB2/3).
  samba:
    image: ghcr.io/servercontainers/samba:latest
    restart: unless-stopped
    ports:
      - "445:445"
    environment:
      ACCOUNT_scanner: ${SCANNER_PASSWORD:?SCANNER_PASSWORD in .env setzen}
      UID_scanner: "1000"
      SAMBA_VOLUME_CONFIG_scans: >-
        [scans]; path=/shares/scans; valid users = scanner;
        guest ok = no; read only = no; browseable = yes;
        force user = scanner; create mask = 0664
    volumes:
      - ./consume:/shares/scans

  # Optional: FTP für Scanner ohne SMB. Passive Ports müssen erreichbar sein;
  # FTP_ADDRESS ist die IP dieses Rechners im Heimnetz.
  ftp:
    image: delfer/alpine-ftp-server:latest
    restart: unless-stopped
    profiles: ["ftp"]
    ports:
      - "21:21"
      - "21000-21010:21000-21010"
    environment:
      USERS: "scanner|${SCANNER_PASSWORD:?SCANNER_PASSWORD in .env setzen}|/ftp/scanner|1000"
      ADDRESS: ${FTP_ADDRESS:-}
      MIN_PORT: "21000"
      MAX_PORT: "21010"
    volumes:
      - ./consume:/ftp/scanner
